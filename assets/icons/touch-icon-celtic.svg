<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Ordinarium Celtic cross icon</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0c5ab"/>
      <stop offset="1" stop-color="#b69c83"/>
    </linearGradient>
    <path id="arm" d="M446 512 L416 172 Q512 144 608 172 L578 512 Z"/>
    <g id="cross">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(90 512 512)"/>
      <use href="#arm" transform="rotate(180 512 512)"/>
      <use href="#arm" transform="rotate(270 512 512)"/>
    </g>
    <mask id="ring-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white"/>
      <use href="#cross" fill="black" stroke="black" stroke-width="40" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <g fill="#76323f">
    <circle cx="512" cy="512" r="252" fill="none" stroke="#76323f" stroke-width="88" mask="url(#ring-gap)"/>
    <use href="#cross"/>
  </g>
</svg>
