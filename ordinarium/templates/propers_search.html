{% extends "base.html" %}

{% block title %}Propers search &mdash; Ordinarium{% endblock %}

{% block content %}
<div id="page">
	<h2>Propers search</h2>
	<p>Select a date to view the season and matching observances with associated propers.</p>
	<div class="propers-search-controls">
		<label class="propers-search-label" for="propers-search-date">Service date</label>
		<div class="propers-search-date-controls" role="group" aria-label="Service date navigation">
			<button type="button" class="propers-search-shift" data-shift="-7" aria-label="Previous week">&laquo;</button>
			<button type="button" class="propers-search-shift" data-shift="-1" aria-label="Previous day">&lsaquo;</button>
			<input id="propers-search-date" type="date" value="{{ today }}" />
			<button type="button" class="propers-search-shift" data-shift="1" aria-label="Next day">&rsaquo;</button>
			<button type="button" class="propers-search-shift" data-shift="7" aria-label="Next week">&raquo;</button>
		</div>
		<button type="button" id="propers-search-button">Search</button>
	</div>
	<div class="propers-search-summary" id="propers-search-summary" aria-live="polite"></div>
	<div class="propers-search-results" id="propers-search-results"></div>
</div>
<script>
	const dateInput = document.querySelector('#propers-search-date')
	const searchButton = document.querySelector('#propers-search-button')
	const summary = document.querySelector('#propers-search-summary')
	const results = document.querySelector('#propers-search-results')
	const shiftButtons = document.querySelectorAll('.propers-search-shift')

	const formatDateInput = (date) => {
		const year = date.getFullYear()
		const month = `${date.getMonth() + 1}`.padStart(2, '0')
		const day = `${date.getDate()}`.padStart(2, '0')
		return `${year}-${month}-${day}`
	}

	const parseDateInput = (value) => {
		if (!value) {
			return null
		}
		const [year, month, day] = value.split('-').map(Number)
		if (!year || !month || !day) {
			return null
		}
		return new Date(year, month - 1, day)
	}

	const shiftDateBy = (days) => {
		const currentDate = parseDateInput(dateInput.value)
		if (!currentDate) {
			return
		}
		currentDate.setDate(currentDate.getDate() + days)
		dateInput.value = formatDateInput(currentDate)
		fetchResults()
	}

	const buildLessonList = (lessons) => {
		const entries = [
			{ label: 'First Lesson', value: lessons?.lesson_1 },
			{ label: 'Psalm', value: lessons?.psalm },
			{ label: 'Second Lesson', value: lessons?.lesson_2 },
			{ label: 'Gospel', value: lessons?.gospel },
		]
		const list = document.createElement('ul')
		list.classList.add('propers-search-lessons')
		entries.forEach((entry) => {
			if (!entry.value) {
				return
			}
			const item = document.createElement('li')
			item.textContent = `${entry.label}: ${entry.value}`
			list.appendChild(item)
		})
		return list
	}

	const renderResults = (payload) => {
		results.innerHTML = ''
		summary.textContent = ''
		if (!payload?.date || !payload?.season) {
			summary.textContent = 'Select a valid date to view results.'
			return
		}
		summary.textContent = ''
		const seasonLabel = document.createElement('strong')
		seasonLabel.textContent = `Season: ${payload.season}`
		summary.appendChild(seasonLabel)
		if (!payload.observances?.length) {
			results.innerHTML = '<p class="propers-search-empty">No observances found.</p>'
			return
		}
		payload.observances.forEach((observance) => {
			const card = document.createElement('section')
			card.classList.add('propers-search-card')
			const heading = document.createElement('h3')
			heading.textContent = observance.title || observance.handle
			card.appendChild(heading)

			const meta = document.createElement('p')
			meta.classList.add('propers-search-meta')
			const subcycle = observance.subcycle ? ` • Year ${observance.subcycle}` : ''
			meta.textContent = `${observance.style}${subcycle}`
			card.appendChild(meta)

			const list = document.createElement('dl')
			list.classList.add('propers-search-details')

			const appendDetail = (term, value, options = {}) => {
				const dt = document.createElement('dt')
				dt.textContent = term
				const dd = document.createElement('dd')
				if (options.node) {
					dd.appendChild(options.node)
				} else if (options.html) {
					const wrapper = document.createElement('div')
					wrapper.classList.add('propers-search-markdown')
					wrapper.innerHTML = value || '<p>Unavailable.</p>'
					dd.appendChild(wrapper)
				} else {
					dd.textContent = value || 'Unavailable.'
				}
				list.appendChild(dt)
				list.appendChild(dd)
			}

			appendDetail('Acclamation', observance.acclamation, { html: true })
			appendDetail('Collect', observance.collect, { html: true })
			appendDetail('Proper Preface', observance.proper_preface, { html: true })
			const lessons = buildLessonList(observance.lessons)
			if (lessons.children.length) {
				appendDetail('Lessons', null, { node: lessons })
			} else {
				appendDetail('Lessons', null)
			}
			card.appendChild(list)

			results.appendChild(card)
		})
	}

	const fetchResults = async () => {
		const selectedDate = dateInput.value
		if (!selectedDate) {
			renderResults({ date: null, season: null, observances: [] })
			return
		}
		summary.textContent = 'Loading results…'
		results.innerHTML = ''
		const response = await fetch(`/propers-search/results?date=${encodeURIComponent(selectedDate)}`)
		if (!response.ok) {
			summary.textContent = 'Unable to load results.'
			return
		}
		const payload = await response.json()
		renderResults(payload)
	}

	searchButton.addEventListener('click', fetchResults)
	dateInput.addEventListener('change', fetchResults)
	shiftButtons.forEach((button) => {
		button.addEventListener('click', () => {
			const shift = Number(button.dataset.shift)
			if (!Number.isNaN(shift)) {
				shiftDateBy(shift)
			}
		})
	})

	if (dateInput.value) {
		fetchResults()
	}
</script>
{% endblock %}
