{% extends 'base.html' %}

{% block content %}

<div id="page">
	<div class="plan-header">
		<h2>Choose a new password</h2>
	</div>

	<form class="auth-form" method="post">
		<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
		<p><label class="plan-field">
			<span>New password:</span>
			<input type="password" name="password" autocomplete="new-password" required>
		</label></p>
		{% include "_turnstile.html" %}
		<div class="auth-actions">
			<button class="plan-submit" type="submit">Update password</button>
		</div>
	</form>

	<p class="auth-alt">Need to request a new link? <a href="{{ url_for('main.request_password_reset') }}">Send another reset email</a></p>
</div>

{% endblock %}
