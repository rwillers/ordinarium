name: Cloudflare Worker

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-worker.yml"
      - "cloudflare/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-worker.yml"
      - "cloudflare/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test Worker behavior
        run: npm test
